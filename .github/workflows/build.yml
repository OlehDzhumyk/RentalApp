# @file build.yml
# @brief Optimized CI/CD pipeline with dummy configuration generation and split testing
# @author RentalApp Development Team
# @date 2026

name: Build & Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: RentalApp_Test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workloads
        run: dotnet workload install maui-android

      - name: Create dummy appsettings.json
        run: |
          mkdir -p RentalApp.Database
          echo '{
            "ConnectionStrings": {
              "DevelopmentConnection": "Host=localhost;Port=5432;Database=RentalApp_Test;Username=app_user;Password=app_password"
            }
          }' > ./RentalApp.Database/appsettings.json

      - name: Restore dependencies
        run: dotnet restore ./RentalApp.sln -p:TargetFrameworks=net10.0

      - name: Build Solution
        run: dotnet build ./RentalApp.sln --configuration Release --no-restore -p:TargetFrameworks=net10.0

      - name: Run Unit Tests
        run: >
          dotnet test ./RentalApp.Test/RentalApp.Test.csproj 
          --configuration Release 
          --no-build 
          --filter "FullyQualifiedName~Unit"
          --collect:"XPlat Code Coverage"
          --logger:"console;verbosity=normal"

      - name: Run Integration Tests
        run: >
          dotnet test ./RentalApp.Test/RentalApp.Test.csproj 
          --configuration Release 
          --no-build 
          --filter "FullyQualifiedName~Integration"
          --collect:"XPlat Code Coverage"
          --logger:"console;verbosity=normal"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: true
