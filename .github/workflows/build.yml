name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d appdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore RentalApp.sln

      # Builds the plain net10.0 library and the Android app
      - name: Build
        run: dotnet build RentalApp.sln --configuration Release --no-restore

      # Applies the real migrations to PostGIS (the integration tests use EnsureCreated instead)
      - name: Apply migrations and seed demo data
        run: dotnet run --project RentalApp.Migrations --configuration Release --no-build -- --seed

      - name: Test
        run: >
          dotnet test RentalApp.Test/RentalApp.Test.csproj
          --configuration Release --no-build --framework net10.0
          --results-directory ./TestResults --logger trx
          --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx
          retention-days: 7
