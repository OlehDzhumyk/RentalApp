# @file build.yml
# @brief Optimized CI/CD pipeline with workload caching and parallel execution logic
# @author RentalApp Development Team
# @date 2026

name: Build & Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache MAUI Workloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/sdk-advertising
            ~/.dotnet/metadata
            ~/.dotnet/packs
          key: ${{ runner.os }}-maui-workload-android-${{ hashFiles('**/*.csproj', '**/global.json') }}

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Create Dummy Config
        run: |
          mkdir -p RentalApp.Database
          echo '{"ConnectionStrings": {"DevelopmentConnection": "Host=localhost;Database=RentalApp_Test;Username=app_user;Password=app_password"}}' > ./RentalApp.Database/appsettings.json

      - name: Build (Release)
        run: dotnet build ./RentalApp.sln --configuration Release -p:TargetFrameworks=net10.0

  test:
    name: Run Test Suites
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: RentalApp_Test
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd "pg_isready -U app_user" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create Dummy Config for Tests
        run: |
          mkdir -p RentalApp.Database
          echo '{"ConnectionStrings": {"DevelopmentConnection": "Host=localhost;Database=RentalApp_Test;Username=app_user;Password=app_password"}}' > ./RentalApp.Database/appsettings.json

      - name: Run Unit Tests
        run: dotnet test ./RentalApp.Test/RentalApp.Test.csproj --filter "FullyQualifiedName~Unit" --collect:"XPlat Code Coverage"

      - name: Run Integration Tests
        run: dotnet test ./RentalApp.Test/RentalApp.Test.csproj --filter "FullyQualifiedName~Integration" --collect:"XPlat Code Coverage"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/coverage.cobertura.xml'
