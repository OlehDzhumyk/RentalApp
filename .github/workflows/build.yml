# @file build.yml
# @brief CI/CD pipeline for building and testing the RentalApp
# @author RentalApp Development Team
# @date 2026

name: Build & Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      

    services:

      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Create dummy appsettings.json
        run: |
          mkdir -p RentalApp.Database
          echo '{
            "ConnectionStrings": {
              "DevelopmentConnection": "Host=localhost;Database=appdb;Username=app_user;Password=app_password"
            }
          }' > ./RentalApp.Database/appsettings.json

      - name: Restore dependencies
        # Обмежуємо відновлення тільки до net10.0, щоб уникнути помилок з Apple SDK на Linux.
        run: dotnet restore ./RentalApp.sln -p:TargetFrameworks=net10.0

      - name: Build
        # Збираємо рішення в режимі Release для цільової платформи net10.0.
        run: dotnet build ./RentalApp.sln --configuration Release --no-restore -p:TargetFrameworks=net10.0

      - name: Run tests
        # Запускаємо xUnit тести та збираємо дані про покриття коду.
        run: dotnet test ./RentalApp.Test/RentalApp.Test.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/coverage.cobertura.xml'