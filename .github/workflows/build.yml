# @file build.yml
# @brief High-performance CI/CD pipeline with caching and logic splitting
# @author RentalApp Development Team
# @date 2026

name: Build & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pipeline:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: RentalApp_Test
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd "pg_isready -U app_user" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Cache Packages & Workloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/sdk-advertising
            ~/.dotnet/metadata
            ~/.dotnet/packs
          key: ${{ runner.os }}-maui-dev-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-maui-dev-

      - name: 🛠️ Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: 📝 Prepare Config (Embedded Resource)
        run: |
          mkdir -p RentalApp.Database
          echo '{"ConnectionStrings": {"DevelopmentConnection": "Host=localhost;Database=RentalApp_Test;Username=app_user;Password=app_password"}}' > ./RentalApp.Database/appsettings.json

      - name: 🔨 Fast Build (DevMode)
        # Using DevMode to skip mobile compilation overhead during testing
        run: dotnet build ./RentalApp.sln --configuration Release -p:DevMode=true -p:TargetFrameworks=net10.0

      - name: 🧪 Run Unit Tests
        run: |
          dotnet test ./RentalApp.Test/RentalApp.Test.csproj \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~Unit" \
            --collect:"XPlat Code Coverage"

      - name: 🔗 Run Integration Tests (PostGIS)
        run: |
          dotnet test ./RentalApp.Test/RentalApp.Test.csproj \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~Integration" \
            --collect:"XPlat Code Coverage"

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/TestResults/*/coverage.cobertura.xml'
          fail_ci_if_error: false

      - name: 📁 Archiving Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rentalapp-test-results
          path: '**/TestResults/*.trx'
