# @file build.yml
# @brief Professional CI/CD pipeline for .NET 10 MAUI & PostGIS
# @author RentalApp Development Team
# @date 2026

name: Build & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pipeline:
    name: Continuous Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          # Literals are required here as secrets are not accessible in services block
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d appdb" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workloads
        run: dotnet workload install maui-android

      - name: Prepare Configuration
        run: |
          mkdir -p RentalApp.Database
          cat <<EOF > ./RentalApp.Database/appsettings.json
          {
            "ConnectionStrings": {
              "DevelopmentConnection": "Host=localhost;Port=5432;Database=appdb;Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }};Include Error Detail=true"
            }
          }
          EOF

      - name: Restore Dependencies
        run: dotnet restore ./RentalApp.sln

      - name: Build Solution
        run: |
          dotnet build-server shutdown
          dotnet build ./RentalApp.sln --configuration Release --no-restore --no-incremental

      - name: Execute Tests
        run: |
          dotnet test ./RentalApp.Test/RentalApp.Test.csproj \
            --configuration Release \
            --no-build \
            --framework net10.0 \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/*.xml
          fail_ci_if_error: false

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx
          retention-days: 7
