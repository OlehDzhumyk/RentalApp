# @file build.yml
# @brief Professional CI/CD pipeline for .NET 10 MAUI & PostGIS
# @author RentalApp Development Team
# @date 2026

name: Build & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Standardized environment for steps
  DB_NAME: RentalApp_Test
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # JOB 1: Validation of core logic and database integration
  test-logic:
    name: Logic and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: RentalApp_Test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.DB_USER }} -d RentalApp_Test" 
          --health-interval 10s

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Prepare Configuration
        run: |
          mkdir -p RentalApp.Database
          cat <<EOF > ./RentalApp.Database/appsettings.json
          {
            "ConnectionStrings": {
              "DevelopmentConnection": "Host=localhost;Port=5432;Database=${{ env.DB_NAME }};Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }}"
            }
          }
          EOF

      - name: Build and Test Logic
        run: |
          dotnet build-server shutdown
          dotnet restore ./RentalApp.sln
          # Build only the core library target to skip MAUI platform checks
          dotnet build ./RentalApp.sln --configuration Release -f net10.0 --no-restore --no-incremental
          dotnet test ./RentalApp.Test/RentalApp.Test.csproj \
            --configuration Release \
            --no-build \
            --framework net10.0 \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/*.xml

  # JOB 2: Platform-specific build validation
  build-android:
    name: Android Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache MAUI Workloads
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/packs
          key: ${{ runner.os }}-maui-android-${{ hashFiles('**/*.csproj') }}

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Build Android Package
        run: |
          dotnet build-server shutdown
          dotnet build ./RentalApp/RentalApp.csproj --configuration Release -f net10.0-android --no-incremental

      - name: Publish Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: ./**/*.log
          retention-days: 7
